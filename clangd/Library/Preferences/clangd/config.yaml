# Config global de clangd (macOS: ~/Library/Preferences/clangd/config.yaml)
# Usa los headers de GCC (Homebrew) para que funcione <bits/stdc++.h>.
# Requiere --query-driver en ghost-nvim (lua/ghost/plugins/lang/cpp.lua).
If:
  PathMatch: .*\.(cpp|cc|cxx|hpp|h)
CompileFlags:
  Compiler: /opt/homebrew/bin/g++-16
  Add: [-std=c++20]
---
If:
  PathMatch: .*\.c
CompileFlags:
  Compiler: /opt/homebrew/bin/gcc-16
  Add: [-std=c11]
